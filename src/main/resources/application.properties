# ===============================
# CONFIGURAÇÃO DO BANCO DE DADOS
# ===============================

quarkus.datasource.db-kind=sqlite
quarkus.datasource.jdbc.url=jdbc:sqlite:/opt/app/data/simuladorteste25.db
quarkus.datasource.jdbc.driver=org.sqlite.JDBC

quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.hibernate-orm.log.sql=true

#quarkus.hibernate-orm.database.generation=update

# ===============================
# OPENAPI / SWAGGER
# ===============================
quarkus.smallrye-openapi.path=/openapi
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/swagger-ui
quarkus.swagger-ui.theme=flattop


# ===============================
# LOGGING OPCIONAL
# ===============================
quarkus.log.category."br.com.mattos.simuladorinvestimento".level=DEBUG

