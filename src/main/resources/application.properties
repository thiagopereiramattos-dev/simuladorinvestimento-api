quarkus.datasource.db-kind=sqlite
quarkus.datasource.jdbc.url=jdbc:sqlite:data/simuladorteste25.db
quarkus.datasource.jdbc.driver=org.sqlite.JDBC
#quarkus.datasource.jdbc.max-size=1
#quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.hibernate-orm.log.sql=true

# Habilita a geração do OpenAPI
quarkus.smallrye-openapi.path=/openapi

# Habilita o Swagger UI
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/swagger-ui
quarkus.swagger-ui.theme=flattop

# Desabilita qualquer auditoria/histórico do Hibernate
#quarkus.hibernate-orm.envers.enabled=false

# Faz com que Quarkus lance NotFoundException para rotas não encontradas
#quarkus.resteasy-reactive.throw-exception-if-no-handler-found=true


